# Entorno conda que usa el Dockerfile (también sirve para instalar en local con micromamba/conda)
name: psi4web
channels:
  - conda-forge
dependencies:
  - python=3.12
  - psi4=1.11
  - pcmsolver        # solvatación PCM (Psi4 de conda-forge viene compilado con PCMSolver)
  - rdkit
  - numpy
  - nodejs=22
